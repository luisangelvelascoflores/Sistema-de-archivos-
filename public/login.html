<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{

    font-family: Arial;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

}

.login{

    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 300px;

}

input{

    width: 100%;
    padding: 10px;
    margin-top: 10px;

}

button{

    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: blue;
    color: white;
    border: none;
    cursor: pointer;

}

</style>

</head>
<body>

<div class="login">

<h2>Iniciar Sesión</h2>

<input type="email" id="correo" placeholder="Correo">

<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">

Entrar

</button>

</div>

<script>

async function login(){

    const correo = document.getElementById("correo").value;

    const password = document.getElementById("password").value;

    const respuesta = await fetch("/login", {

        method: "POST",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify({

            correo,
            password

        })

    });

    const resultado = await respuesta.json();

    alert(resultado.mensaje);

    if(resultado.mensaje === "Login correcto"){

        localStorage.setItem(

            "usuario",

            JSON.stringify(resultado.usuario)

        );

        const rol = resultado.usuario.nombre_rol;

        if(rol === "DG"){

            window.location.href = "admin.html";

        }else if(rol === "CI"){

            window.location.href = "revision.html";

        }else if(rol === "ACA"){

            window.location.href = "subir.html";

        }else if(rol === "D"){

            window.location.href = "direccion.html";

        }else if(rol === "AG"){

            window.location.href = "ag.html";

        }

    }

}

</script>

</body>
</html>
