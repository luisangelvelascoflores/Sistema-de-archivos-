<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos</title>

    <style>

        body{

            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;

        }

        table{

            width: 100%;
            border-collapse: collapse;
            background: white;

        }

        th, td{

            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;

        }

        button{

            padding: 5px 10px;
            cursor: pointer;

        }

        .cerrar{

            background: red;
            color: white;
            border: none;
            margin-bottom: 20px;

        }

    </style>

</head>
<body>

    <button class="cerrar" onclick="cerrarSesion()">

        Cerrar Sesión

    </button>

    <h2>Lista de Documentos</h2>

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Archivo</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Abrir</th>
                <th>Eliminar</th>

            </tr>

        </thead>

        <tbody id="tablaDocumentos">

        </tbody>

    </table>

<script>

const usuario = JSON.parse(localStorage.getItem("usuario"));

async function cargarDocumentos(){

    const respuesta = await fetch("/documentos");

    const documentos = await respuesta.json();

    const tabla = document.getElementById("tablaDocumentos");

    tabla.innerHTML = "";

    documentos.forEach(doc => {

        tabla.innerHTML += `

        <tr>

            <td>${doc.id}</td>

            <td>${doc.nombre_archivo}</td>

            <td>${doc.nombre_estado}</td>

            <td>${doc.fecha_subida}</td>

            <td>

                <a href="/uploads/${doc.nombre_archivo}" target="_blank">

                    Abrir

                </a>

            </td>

            <td>

                ${usuario.nombre_rol === "DG" ? `

                <button onclick="eliminarArchivo(${doc.id})">

                    Eliminar

                </button>

                ` : "Sin permiso"}

            </td>

        </tr>

        `;

    });

}

async function eliminarArchivo(id){

    const confirmar = confirm("¿Eliminar archivo?");

    if(!confirmar){

        return;

    }

    const respuesta = await fetch(`/eliminar/${id}`, {

        method: "DELETE"

    });

    const resultado = await respuesta.json();

    alert(resultado.mensaje);

    cargarDocumentos();

}

function cerrarSesion(){

    localStorage.removeItem("usuario");

    window.location.href = "login.html";

}

cargarDocumentos();

</script>

</body>
</html>
